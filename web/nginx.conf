server {
  listen 3000;
  root /usr/share/nginx/html;
  location / { try_files $uri /index.html; }
  # The gateway calls these on the brain over the internal network. The web never does, so they are
  # not reachable from outside. A regex match wins over the /api/ prefix below.
  location ~ ^/api/v1/(inspect|unmask) { return 404; }
  location /api/ {
    proxy_pass http://brain:8001/;
    client_max_body_size 12m;
    proxy_read_timeout 130s;
  }
  # AI gateway: the chat page talks to it on the same origin, so no CORS and no key in the URL.
  location /gateway/ {
    proxy_pass http://gateway:4000/;
    proxy_read_timeout 120s;
    proxy_buffering off;
  }
}
