server {
  listen 3000;
  root /usr/share/nginx/html;
  location / { try_files $uri /index.html; }
  location = /extension.zip {
    add_header Content-Disposition 'attachment; filename="sentry-extension.zip"';
  }
  location /api/ { proxy_pass http://brain:8001/; }
  # Optional AI gateway (`make gateway`). Resolved when used, so the dashboard starts without it.
  location /gateway/ {
    resolver 127.0.0.11 valid=10s;
    set $gateway http://gateway:4000;
    rewrite ^/gateway/(.*)$ /$1 break;
    proxy_pass $gateway;
    proxy_read_timeout 120s;
    proxy_buffering off;
  }
}
