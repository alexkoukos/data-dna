server {
  listen 3000;
  root /usr/share/nginx/html;
  location / { try_files $uri /index.html; }
  location /api/ { proxy_pass http://brain:8001/; }
  # AI gateway: the chat page talks to it on the same origin, so no CORS and no key in the URL.
  location /gateway/ {
    proxy_pass http://gateway:4000/;
    proxy_read_timeout 120s;
    proxy_buffering off;
  }
}
