# Complete SAMPLE organisation, used by the seed while data/org/org.yaml still says "TBD".
# Everything is invented. Konstantinos and Vasilis: copy this shape into org.yaml and make it yours.
#
# Fields
#   teams[].ai_tools: tool name (must exist in ai_tools.csv) -> how often people in the team use it:
#       daily (about 5 requests on a working day), weekly (about 1 a week), rare (about 1 in 3 weeks)
#   teams[].roles:    role names used for users (first is the most common)
#   storyline[]:      day 1 = oldest of the 14 days, 14 = yesterday
#       kind: tool_spike | api_key_paste | contract_paste | salary_questions | memo_rebuild
company:
  name: "Aegean Meridian Consulting"
  industry: consulting
  employees: 200
teams:
  - name: Engineering
    size: 46
    roles: [Developer, Tech lead, DevOps engineer]
    ai_tools: { "Company AI": daily, "Claude Code (gateway)": daily, "GitHub Copilot": daily, "ChatGPT (personal)": weekly }
  - name: Sales
    size: 30
    roles: [Account executive, Sales manager]
    ai_tools: { "Company AI": weekly, "ChatGPT (personal)": daily, "Gemini": weekly, "Otter.ai": weekly }
  - name: Legal
    size: 14
    roles: [Lawyer, Paralegal]
    ai_tools: { "Company AI": daily, "DeepL": weekly, "ChatGPT (personal)": rare }
  - name: HR
    size: 10
    roles: [HR partner, Recruiter]
    ai_tools: { "Company AI": daily, "ChatGPT (personal)": weekly, "Grammarly": weekly }
  - name: Finance
    size: 24
    roles: [Accountant, Financial analyst]
    ai_tools: { "Company AI": daily, "Microsoft Copilot": weekly }
  - name: Marketing
    size: 22
    roles: [Content specialist, Designer]
    ai_tools: { "Company AI": weekly, "ChatGPT (personal)": daily, "Midjourney": daily, "Canva": daily, "Grammarly": daily }
  - name: Operations
    size: 44
    roles: [Operations specialist, Project manager]
    ai_tools: { "Company AI": daily, "DeepSeek": weekly, "Microsoft Copilot": weekly }
  - name: Executive
    size: 10
    roles: [Director, Assistant]
    ai_tools: { "Company AI": daily, "Claude.ai": weekly }
clients:
  - { name: "Hellenic Marine Logistics", aliases: ["HML"] }
  - { name: "Olympos Retail", aliases: ["Olympos"] }
  - { name: "Thessaly Energy Cooperative", aliases: ["TEC"] }
  - { name: "Cycladic Hotels Group", aliases: ["CHG"] }
  - { name: "Pindos Telecom", aliases: ["Pindos"] }
  - { name: "Attica Health Network", aliases: ["AHN"] }
  - { name: "Naxos Agri Foods", aliases: [] }
  - { name: "Delphi Insurance", aliases: ["Delphi"] }
  - { name: "Argo Shipping", aliases: [] }
  - { name: "Minoan Bank", aliases: ["Minoan"] }
documents:
  - { title: "Board memo: expansion into the Balkans", sensitivity: restricted, owner_team: Executive }
  - { title: "Master services agreement: Delphi Insurance", sensitivity: confidential, owner_team: Legal }
  - { title: "Salary bands 2027", sensitivity: confidential, owner_team: HR }
storyline:
  - { day: 3, kind: tool_spike, team: Sales, tool: "ChatGPT (personal)", note: "Sales starts pasting customer lists into a personal ChatGPT account" }
  - { day: 5, kind: api_key_paste, team: Engineering, note: "A developer pastes a cloud access key" }
  - { day: 7, kind: contract_paste, team: Legal, note: "A lawyer pastes a client contract" }
  - { day: 9, kind: salary_questions, team: HR, note: "HR asks about salaries" }
  - { day: 10, kind: memo_rebuild, team: Executive, note: "One person rebuilds the board memo over several prompts" }
  - { day: 12, kind: tool_spike, team: Operations, tool: "DeepSeek", note: "Operations starts using an unapproved tool" }
