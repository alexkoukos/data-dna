# One command: docker compose up --build   (Netcompany rule: must build and start on Linux)
# Gateway (LiteLLM) and the local model are added in TASKS.md items G1 and L1.
name: data-dna

services:
  db:
    build: ./infra/db
    environment:
      POSTGRES_USER: ${DB_USER:-dna}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me}
      POSTGRES_DB: ${DB_NAME:-dna}
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-dna} -d ${DB_NAME:-dna}"]
      interval: 5s
      timeout: 3s
      retries: 20

  brain:
    build: ./services/brain
    environment:
      DATABASE_URL: postgresql+psycopg://${DB_USER:-dna}:${DB_PASSWORD:-change-me}@db:5432/${DB_NAME:-dna}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-admin-change-me}
      GATEWAY_URL: http://gateway:4000
      DEMO_MODE: ${DEMO_MODE:-true}
      DATA_DIR: /data
      RETENTION_DAYS: ${RETENTION_DAYS:-30}
      # Few threads per model: many small requests beat one wide one (see the load test).
      OMP_NUM_THREADS: ${OMP_NUM_THREADS:-4}
      EMBED_THREADS: ${EMBED_THREADS:-4}
    volumes:
      - models:/models
      - ./data:/data:ro
      - logs:/var/dna/logs
    ports:
      - "8001:8001"
    depends_on:
      db:
        condition: service_healthy

  gateway:
    build: ./infra/gateway
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-admin-change-me}
      LITELLM_DATABASE_URL: postgresql://${DB_USER:-dna}:${DB_PASSWORD:-change-me}@db:5432/litellm
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      BRAIN_URL: http://brain:8001
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
      brain:
        condition: service_healthy

  web:
    build: ./web
    ports:
      - "3000:3000"
    depends_on:
      brain:
        condition: service_healthy
      gateway:
        condition: service_healthy

  # Employee simulator (TASKS.md O3). Not started by `up`: run `make simulate`.
  sim:
    profiles: ["sim"]
    image: data-dna-brain
    entrypoint: ["python", "/scripts/simulate.py"]
    command: ["--count", "60"]
    environment:
      BRAIN_URL: http://brain:8001
      GATEWAY_URL: http://gateway:4000
      DATA_DIR: /data
    volumes:
      - ./scripts:/scripts:ro
      - ./data:/data:ro
    depends_on:
      gateway:
        condition: service_healthy

volumes:
  dbdata:
  models:
  logs:
