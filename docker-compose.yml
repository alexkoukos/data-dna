# One command: docker compose up --build   (Netcompany rule: must build and start on Linux)
# The product is the browser extension plus the dashboard. The LiteLLM gateway runs by default: Company
# Chat (/chat) answers through it, and scripts and coding tools use it too. The local model is an
# optional profile: `make local`.
name: sentry

services:
  db:
    build: ./infra/db
    environment:
      POSTGRES_USER: ${DB_USER:-dna}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me}
      POSTGRES_DB: ${DB_NAME:-dna}
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${DB_USER:-dna} -d ${DB_NAME:-dna}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Split storage (services/brain/src/brain/splitstore). Two independent vaults: own credentials,
  # own volume, own internal network. Only brain is on both networks; the vaults cannot reach
  # each other, and `internal: true` also cuts them off from the internet.
  vault-a:
    image: postgres:16@sha256:3950ad7c3148ca2175ef1b6c36c9efbf78957ae8fbe8b3a5d7c35af50500382f
    command: ["postgres", "-c", "max_prepared_transactions=20"] # two-phase commit for split writes
    environment:
      # Admin account: only used to create the schema and the app role at first start.
      POSTGRES_USER: ${VAULT_A_ADMIN_USER:-vault_a_admin}
      POSTGRES_PASSWORD: ${VAULT_A_ADMIN_PASSWORD:-change-me-a-admin}
      POSTGRES_DB: vault
      # The role the app connects as (not a superuser).
      APP_USER: ${VAULT_A_USER:-vault_a}
      APP_PASSWORD: ${VAULT_A_PASSWORD:-change-me-a}
    volumes:
      - vault-a-data:/var/lib/postgresql/data
      - ./infra/vault/init.sql:/schema/init.sql:ro
      - ./infra/vault/create-app-role.sh:/docker-entrypoint-initdb.d/01-create-app-role.sh:ro
    networks: [vault-a-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${VAULT_A_ADMIN_USER:-vault_a_admin} -d vault"]
      interval: 5s
      timeout: 3s
      retries: 20

  vault-b:
    image: postgres:16@sha256:3950ad7c3148ca2175ef1b6c36c9efbf78957ae8fbe8b3a5d7c35af50500382f
    command: ["postgres", "-c", "max_prepared_transactions=20"] # two-phase commit for split writes
    environment:
      # Admin account: only used to create the schema and the app role at first start.
      POSTGRES_USER: ${VAULT_B_ADMIN_USER:-vault_b_admin}
      POSTGRES_PASSWORD: ${VAULT_B_ADMIN_PASSWORD:-change-me-b-admin}
      POSTGRES_DB: vault
      # The role the app connects as (not a superuser).
      APP_USER: ${VAULT_B_USER:-vault_b}
      APP_PASSWORD: ${VAULT_B_PASSWORD:-change-me-b}
    volumes:
      - vault-b-data:/var/lib/postgresql/data
      - ./infra/vault/init.sql:/schema/init.sql:ro
      - ./infra/vault/create-app-role.sh:/docker-entrypoint-initdb.d/01-create-app-role.sh:ro
    networks: [vault-b-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${VAULT_B_ADMIN_USER:-vault_b_admin} -d vault"]
      interval: 5s
      timeout: 3s
      retries: 20

  brain:
    build:
      context: ./services/brain
      target: app
    environment:
      VAULT_A_URL: postgresql://${VAULT_A_USER:-vault_a}:${VAULT_A_PASSWORD:-change-me-a}@vault-a:5432/vault
      VAULT_B_URL: postgresql://${VAULT_B_USER:-vault_b}:${VAULT_B_PASSWORD:-change-me-b}@vault-b:5432/vault
      HMAC_KEY_FILE: ${HMAC_KEY_FILE:-/var/dna/keys/hmac_key}
      VAULT_API_TOKEN: ${VAULT_API_TOKEN:-}
      DATABASE_URL: postgresql+psycopg://${DB_USER:-dna}:${DB_PASSWORD:-change-me}@db:5432/${DB_NAME:-dna}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-admin-change-me}
      GATEWAY_URL: http://gateway:4000
      DEMO_MODE: ${DEMO_MODE:-true}
      DATA_DIR: /data
      EXTENSION_ID: ${EXTENSION_ID:-}
      # X30: SIEM push. All off unless set in .env; see docs/siem/README.md.
      SIEM_SYSLOG_HOST: ${SIEM_SYSLOG_HOST:-}
      SIEM_SYSLOG_PORT: ${SIEM_SYSLOG_PORT:-514}
      SIEM_SYSLOG_PROTO: ${SIEM_SYSLOG_PROTO:-udp}
      SIEM_WEBHOOK_URL: ${SIEM_WEBHOOK_URL:-}
      SIEM_WEBHOOK_SECRET: ${SIEM_WEBHOOK_SECRET:-}
      SIEM_EXPORT_TOKEN: ${SIEM_EXPORT_TOKEN:-}
      RETENTION_DAYS: ${RETENTION_DAYS:-30}
      # Few threads per model: many small requests beat one wide one (see the load test).
      OMP_NUM_THREADS: ${OMP_NUM_THREADS:-4}
      EMBED_THREADS: ${EMBED_THREADS:-4}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      KEY_RPM_LIMIT: ${KEY_RPM_LIMIT:-0}
      KEY_MAX_BUDGET: ${KEY_MAX_BUDGET:-0}
      COMPANY_AI_URL: ${COMPANY_AI_URL:-http://localhost:3000/chat}
      WEB_URL: ${WEB_URL:-http://localhost:3000}
      SEED_ON_START: ${SEED_ON_START:-true}
      # Files attached in Company Chat (brain/files.py)
      FILE_MAX_BYTES: ${FILE_MAX_BYTES:-10485760}
      FILE_MAX_COUNT: ${FILE_MAX_COUNT:-3}
      FILE_MAX_CHARS: ${FILE_MAX_CHARS:-30000}
      FILE_EXTRACT_TIMEOUT: ${FILE_EXTRACT_TIMEOUT:-15}
    volumes:
      - models:/models
      - ./data:/data:ro
      # X28: approved break-it rows are appended here, so this one folder is writable
      - ./data/eval:/data/eval
      - logs:/var/dna/logs
      - keys:/var/dna/keys # app-only volume holding the HMAC key
      - breakit:/var/dna/breakit # approved break-it rows when data/eval is read-only
    # Published on localhost only: the brain admin API has no login and the gateway uses the
    # master key. Other machines on the network cannot reach them.
    ports:
      - "127.0.0.1:8001:8001"
    networks: [default, vault-a-net, vault-b-net]
    depends_on:
      db:
        condition: service_healthy
      vault-a:
        condition: service_healthy
      vault-b:
        condition: service_healthy

  gateway:
    build: ./infra/gateway
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-admin-change-me}
      LITELLM_DATABASE_URL: postgresql://${DB_USER:-dna}:${DB_PASSWORD:-change-me}@db:5432/litellm
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      BRAIN_URL: http://brain:8001
      LOCAL_LLM_URL: ${LOCAL_LLM_URL:-http://ollama:11434}
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      db:
        condition: service_healthy
      brain:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      brain:
        condition: service_healthy
      gateway:
        condition: service_healthy

  # Offline stand-in for ChatGPT, for the demo and the extension tests (http://localhost:3100).
  mock-ai:
    build: ./mock-ai
    ports:
      - "3100:3100"

  # Local model (TASKS.md L1). Optional and never on the critical path: start it with `make local`.
  # Without it, "answered locally" falls back to a stand-in answer, so the stack and every test
  # work the same.
  ollama:
    profiles: ["local"]
    image: ollama/ollama:0.40.16@sha256:910d0d8107b538fb0894e63163eb195de0cc7aefcbc666dc62d3b18f71124592
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "ollama serve & until ollama list >/dev/null 2>&1; do sleep 1; done; ollama pull $${LOCAL_MODEL} && printf 'FROM %s\\nPARAMETER num_thread %s\\n' $${LOCAL_MODEL} $${LOCAL_THREADS} > /tmp/Modelfile && ollama create dna-local --file /tmp/Modelfile; wait"
    environment:
      LOCAL_MODEL: ${LOCAL_MODEL:-gemma3:1b}
      # Ollama's default thread count was 60 times slower on a 10 core Mac (0.5 against 30 tokens
      # a second), so the thread count is set on the model. See eval/local_llm_bench.md.
      LOCAL_THREADS: ${LOCAL_THREADS:-4}
      OLLAMA_KEEP_ALIVE: 30m
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list | grep -q dna-local"]
      interval: 10s
      timeout: 5s
      retries: 90

  # Split storage tests, run inside the containers: `docker compose run --rm splitstore-tests`.
  # REQUIRE_VAULTS makes a missing vault a failure instead of a skip.
  splitstore-tests:
    profiles: ["test"]
    build:
      context: ./services/brain
      target: test
    entrypoint: ["pytest", "tests/test_splitstore.py", "--no-cov", "-p", "no:cacheprovider"]
    environment:
      VAULT_A_URL: postgresql://${VAULT_A_USER:-vault_a}:${VAULT_A_PASSWORD:-change-me-a}@vault-a:5432/vault
      VAULT_B_URL: postgresql://${VAULT_B_USER:-vault_b}:${VAULT_B_PASSWORD:-change-me-b}@vault-b:5432/vault
      REQUIRE_VAULTS: "1"
    networks: [vault-a-net, vault-b-net]
    depends_on:
      vault-a:
        condition: service_healthy
      vault-b:
        condition: service_healthy
  # X30 demo SOC: a tiny syslog receiver that prints the incidents the brain pushes. Not started by
  # `up`: set SIEM_SYSLOG_HOST=syslog-receiver in .env, then run `make siem`.
  syslog-receiver:
    profiles: ["siem"]
    image: python:3.12-alpine@sha256:c5ba3deef00c7758561a0f03c26f44f10589263d40e732b8748e0d1f38f6dd89
    command: ["python", "-u", "/receiver.py"]
    volumes:
      - ./infra/siem/receiver.py:/receiver.py:ro

  # Employee simulator (TASKS.md O3). Not started by `up`: run `make simulate`.
  sim:
    profiles: ["sim"]
    image: sentry-brain
    pull_policy: never # built by `make up`; never looked up on a registry
    entrypoint: ["python", "/scripts/simulate.py"]
    command: ["--count", "60"]
    environment:
      BRAIN_URL: http://brain:8001
      GATEWAY_URL: http://gateway:4000
      DATA_DIR: /data
    volumes:
      - ./scripts:/scripts:ro
      - ./data:/data:ro
    depends_on:
      brain:
        condition: service_healthy

networks:
  vault-a-net:
    internal: true
  vault-b-net:
    internal: true

volumes:
  vault-a-data:
  vault-b-data:
  dbdata:
  models:
  logs:
  keys:
  breakit:
  ollama:
