<svg xmlns="http://www.w3.org/2000/svg" viewBox="61 6 118 118" width="240" height="240" role="img" aria-label="Thyro"><title>Thyro</title><style>:root{--f:1}
.pop{transform-origin:120px 218px;animation:pop .7s cubic-bezier(.2,.9,.3,1.2) both}
.float{animation:float 4.5s ease-in-out .7s infinite}
.shadow{transform-origin:120px 218px;animation:shadow 4.5s ease-in-out .7s infinite}
.halo{transform-origin:120px 32px;animation:halo 3s ease-in-out infinite}
.lamp{transform-origin:120px 32px;animation:lamp 3s ease-in-out infinite}
.eye,.lid{transform-box:fill-box;transform-origin:center;animation:blink 5.5s 1.2s infinite}
.mouth{transform-box:fill-box;transform-origin:center}
.fin{transform-box:fill-box;transform-origin:50% 100%;animation:fin 3.6s ease-in-out infinite}
.fin2{animation-delay:1.1s}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.88)}to{opacity:1;transform:none}}
@keyframes float{50%{transform:translateY(-3px)}}
@keyframes shadow{0%,100%{opacity:.08;transform:scaleX(1)}50%{opacity:.04;transform:scaleX(.93)}}
@keyframes halo{50%{transform:scale(1.28);opacity:.12}}
@keyframes lamp{50%{transform:scale(1.07)}}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes fin{50%{transform:scale(1.05,1.08)}}
.mouth{animation:smile 6s ease-in-out 1.5s infinite}
@keyframes smile{0%,80%,100%{transform:scale(1)}88%{transform:scale(1.2)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><g class="pop"><ellipse class="shadow" cx="120" cy="218" rx="98" ry="7" fill="#1a1713" opacity=".08"/><g class="float"><g><rect x="68" y="128" width="50" height="76" rx="5" fill="none" stroke="#1a1713" stroke-width="5"><animate attributeName="width" from="50" to="50" begin="0.35s" dur="1.1s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".3 .8 .3 1"/></rect><path d="M68 184H118" stroke="#1a1713" stroke-width="5"><animate attributeName="d" from="M68 184H118" to="M68 184H118" begin="0.35s" dur="1.1s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".3 .8 .3 1"/></path><path d="M84 128V204" stroke="#1a1713" stroke-width="5"><animate attributeName="d" from="M84 128V204" to="M84 128V204" begin="0.35s" dur="1.1s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".3 .8 .3 1"/></path><path d="M102 128V204" stroke="#1a1713" stroke-width="5"><animate attributeName="d" from="M102 128V204" to="M102 128V204" begin="0.35s" dur="1.1s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".3 .8 .3 1"/></path></g><g><rect x="122" y="128" width="50" height="76" rx="5" fill="none" stroke="#1a1713" stroke-width="5"><animate attributeName="x" from="122" to="122" begin="0.35s" dur="1.1s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".3 .8 .3 1"/><animate attributeName="width" from="50" to="50" begin="0.35s" dur="1.1s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".3 .8 .3 1"/></rect><path d="M122 184H172" stroke="#1a1713" stroke-width="5"><animate attributeName="d" from="M122 184H172" to="M122 184H172" begin="0.35s" dur="1.1s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".3 .8 .3 1"/></path><path d="M138 128V204" stroke="#1a1713" stroke-width="5"><animate attributeName="d" from="M138 128V204" to="M138 128V204" begin="0.35s" dur="1.1s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".3 .8 .3 1"/></path><path d="M156 128V204" stroke="#1a1713" stroke-width="5"><animate attributeName="d" from="M156 128V204" to="M156 128V204" begin="0.35s" dur="1.1s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".3 .8 .3 1"/></path></g><path d="M66 118Q120 64 174 118" fill="none" stroke="#1a1713" stroke-width="10" stroke-linecap="round"/><rect x="26" y="78" width="40" height="134" rx="8" fill="#fbfaf7" stroke="#1a1713" stroke-width="5"/><rect x="21" y="68" width="50" height="16" rx="6" fill="#fbfaf7" stroke="#1a1713" stroke-width="5"/><path class="fin " d="M46 32Q49 42 56 47A11 11 0 1 1 36 47Q43 42 46 32Z" fill="#006860" stroke="#1a1713" stroke-width="5" stroke-linejoin="round"/><rect x="174" y="78" width="40" height="134" rx="8" fill="#fbfaf7" stroke="#1a1713" stroke-width="5"/><rect x="169" y="68" width="50" height="16" rx="6" fill="#fbfaf7" stroke="#1a1713" stroke-width="5"/><path class="fin fin2" d="M194 32Q197 42 204 47A11 11 0 1 1 184 47Q191 42 194 32Z" fill="#006860" stroke="#1a1713" stroke-width="5" stroke-linejoin="round"/><circle class="halo" cx="120" cy="32" r="24" fill="#3bada2" opacity=".22"/><path d="M120 46V60" stroke="#1a1713" stroke-width="5" stroke-linecap="round"/><circle class="lamp" cx="120" cy="32" r="13" fill="#3bada2" stroke="#1a1713" stroke-width="5"/><g class="head"><circle cx="120" cy="96" r="30" fill="#fbfaf7" stroke="#1a1713" stroke-width="5"/><g class="eyes"><ellipse class="eye" cx="108" cy="94" rx="4.5" ry="6" fill="#1a1713"/><ellipse class="eye" cx="132" cy="94" rx="4.5" ry="6" fill="#1a1713"/></g><path class="mouth" d="M113 106Q120 112 127 106" fill="none" stroke="#1a1713" stroke-width="4" stroke-linecap="round"/></g></g></g></svg>
