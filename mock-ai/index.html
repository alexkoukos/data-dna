<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mock AI chat</title>
    <style>
      :root { color-scheme: light dark; }
      body { margin: 0; font-family: system-ui, sans-serif; display: flex; flex-direction: column; height: 100vh; }
      header { padding: 12px 16px; border-bottom: 1px solid #8884; font-weight: 600; }
      header small { font-weight: 400; opacity: .7; margin-left: 8px; }
      #messages { flex: 1; overflow: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
      .msg { max-width: 70ch; padding: 10px 14px; border-radius: 12px; white-space: pre-wrap; line-height: 1.5; }
      .user { align-self: flex-end; background: #2b5fd9; color: #fff; }
      .assistant { align-self: flex-start; background: #8882; }
      form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid #8884; }
      textarea { flex: 1; min-height: 52px; padding: 10px; font: inherit; border-radius: 10px; border: 1px solid #8886; }
      button { min-width: 80px; padding: 0 16px; font: inherit; border-radius: 10px; border: 0; background: #2b5fd9; color: #fff; cursor: pointer; }
    </style>
  </head>
  <body>
    <header>Mock AI <small>offline stand-in for ChatGPT. It echoes what it receives.</small></header>
    <main id="messages" aria-live="polite"></main>
    <form id="form">
      <textarea id="prompt" aria-label="Message" placeholder="Ask anything"></textarea>
      <button id="send" type="submit">Send</button>
    </form>
    <script>
      const form = document.getElementById('form');
      const prompt = document.getElementById('prompt');
      const list = document.getElementById('messages');
      const add = (cls, text) => {
        const el = document.createElement('div');
        el.className = 'msg ' + cls;
        el.textContent = text;
        list.append(el);
        list.scrollTop = list.scrollHeight;
      };
      async function send() {
        const message = prompt.value.trim();
        if (!message) return;
        add('user', message);
        prompt.value = '';
        const res = await fetch('/api/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ message }) });
        const { answer } = await res.json();
        add('assistant', answer);
      }
      form.addEventListener('submit', (e) => { e.preventDefault(); send(); });
      prompt.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
      });
    </script>
  </body>
</html>
