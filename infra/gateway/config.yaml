# LiteLLM gateway config (PRD sections 7 and 8).
model_list:
  # Cloud model. Needs OPENAI_API_KEY in .env; without it use demo-mock below.
  - model_name: gpt-4o-mini
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY

  # Offline model for demos and the integration test: always answers, never leaves the machine.
  - model_name: demo-mock
    litellm_params:
      model: openai/demo-mock
      api_key: not-used
      mock_response: "Hello from the Data DNA demo model. Your message passed the safety check."

  # Demo models that let the integration tests prove unmask and output filtering offline.
  - model_name: demo-echo
    litellm_params:
      model: openai/demo-echo
      api_key: not-used
      mock_response: "Noted. I checked [IBAN_1] and it looks well formed."
  - model_name: demo-leaky
    litellm_params:
      model: openai/demo-leaky
      api_key: not-used
      mock_response: "Use this key to deploy: AKIAIOSFODNN7EXAMPLE"

  # The local model: "local" decisions are answered by Ollama on this machine (make local).
  - model_name: local
    litellm_params:
      model: ollama_chat/dna-local
      api_base: os.environ/LOCAL_LLM_URL
      timeout: 120
      max_retries: 0
      max_tokens: 512
  # Used only when the local model is not running, so the demo and the tests still answer.
  - model_name: local-standin
    litellm_params:
      model: openai/local-standin
      api_key: not-used
      mock_response: "Answered on this machine. Your message never left the company."

router_settings:
  num_retries: 0
  fallbacks: [{"local": ["local-standin"]}]

litellm_settings:
  drop_params: true

guardrails:
  - guardrail_name: dna
    litellm_params:
      guardrail: dna_guardrail.DnaGuardrail
      mode: [pre_call, post_call]
      default_on: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/LITELLM_DATABASE_URL
