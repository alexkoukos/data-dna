[project]
name = "brain"
version = "0.1.0"
description = "Data DNA brain: detection, policy, DNA attribution, dashboard API"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "pgvector>=0.3",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "numpy>=1.26",
  "datasketch>=1.6",
  "fastembed>=0.4",
  "presidio-analyzer>=2.2",
  "pyahocorasick>=2.1",
  "yara-python>=4.5",
  "pypdf>=5.0",
  "python-docx>=1.1",
  "python-multipart>=0.0.12",
  "openai>=1.50",
  "faker>=30.0",
  "en-core-web-sm",
  "el-core-news-sm",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.7",
  "mypy>=1.13",
  "anthropic>=0.39",
  "types-pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brain"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/brain/injection/heuristics.py" = ["E501"]
"src/brain/eval/run.py" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.File", "fastapi.Form"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
files = ["src/brain"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=brain --cov-report=term-missing"
markers = ["slow: loads the real embedding model (downloads about 220 MB on the first run)"]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
el-core-news-sm = { url = "https://github.com/explosion/spacy-models/releases/download/el_core_news_sm-3.8.0/el_core_news_sm-3.8.0-py3-none-any.whl" }
