# Seed for the policy table. Used only when the table is empty;
# after that the database is the source of truth and the dashboard edits it.
defaults:
categories:
  greek_id: mask
  iban: mask
  card: mask
  secret: mask
  person_email_phone: mask
  client_name: warn
  source_code: warn
  injection: block
  hidden_data: block # data carried inside an image file (steganography, appended bytes)
  embedded_instructions: warn # orders to the AI written inside a file or picture
  hidden_text: block # text in an image drawn so a person cannot see it, but a model can
  honeytoken: block # a decoy planted in a document: that document has leaked
documents:
  sensitivity:
    internal: local
    confidential: local
    restricted: block # crown-jewel
session:
  rebuild_coverage_block: 0.4
  max_prompts_per_restricted_doc: 3
