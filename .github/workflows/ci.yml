name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  brain:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services/brain } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest
      - run: uv run python ../../scripts/validate_data.py

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run lint && npm run format:check
      - run: npm test
      - run: npm run build

  extension:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: extension } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: extension/package-lock.json }
      - run: npm ci
      - run: npm run lint && npm run format:check
      - run: npm run typecheck
      # The brain and the extension read the same fixtures (shared/fixtures/l1.json).
      - run: npm test
      - run: npx wxt build
      - run: npx playwright install --with-deps chromium && npm run e2e
      - run: npm audit --omit=dev --audit-level=high

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uvx pip-audit -r <(cd services/brain && uv export --frozen --no-dev --no-hashes --no-emit-project)
        shell: bash
      - run: cd web && npm ci && npm audit --omit=dev --audit-level=high

  smoke:
    needs: [brain, web, extension]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: sh scripts/gen_hmac_key.sh
      - run: docker compose up --build -d --wait
      - run: curl -fsS http://localhost:8001/healthz && curl -fsS http://localhost:3000/ >/dev/null
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: cd web && npm ci && npx playwright install --with-deps chromium && npm run e2e
      # The extension against the real stack: the brain on :8001 and mock-ai on :3100 are up.
      - run: cd extension && npm ci && npx wxt build && npx playwright install --with-deps chromium && npm run e2e
      - if: failure()
        run: docker compose logs

  arm64:
    timeout-minutes: 15
    needs: [brain, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - run: docker buildx build --platform linux/arm64 services/brain
      - run: docker buildx build --platform linux/arm64 -f web/Dockerfile .
      - run: docker buildx build --platform linux/arm64 mock-ai

  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
