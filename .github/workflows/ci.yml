name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  brain:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services/brain } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: uv sync --frozen --extra ocr
      - run: uv run python -c "from brain.documents.handwriting import fetch_model_files; fetch_model_files()"
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest
      - run: uv run python ../../scripts/validate_data.py

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run lint && npm run format:check
      - run: npm test
      - run: npm run build
      - run: node --test ../extension/test/logic.test.mjs

  extension:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: extension } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: extension/package-lock.json }
      - run: npm ci
      - run: npm run lint && npm run format:check
      - run: npm run typecheck
      # The brain and the extension read the same fixtures (shared/fixtures/l1.json).
      - run: npm test
      - run: npx wxt build
      - run: npx playwright install --with-deps chromium && npm run e2e
      - run: npm audit --omit=dev --audit-level=high

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uvx --python 3.12 pip-audit -r <(cd services/brain && uv export --frozen --no-dev --no-hashes --no-emit-project)
        shell: bash
      - run: cd web && npm ci && npm audit --omit=dev --audit-level=high

  smoke:
    needs: [brain, web, extension]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: chmod -R a+w data/eval # the non-root brain writes approved break-it rows here
      - run: docker compose up --build -d --wait
      - run: curl -fsS http://localhost:8001/healthz && curl -fsS http://localhost:3000/ >/dev/null
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - run: cd web && npm ci && npx playwright install --with-deps chromium && npm run e2e
      # The extension against the real stack: the brain on :8001 and mock-ai on :3100 are up.
      - run: cd extension && npm ci && npx wxt build && npx playwright install --with-deps chromium && npm run e2e
      - if: failure()
        run: docker compose logs

  # Builds every image on a native ARM runner (Apple Silicon judges). No QEMU: Node under
  # emulation crashes with "Illegal instruction" on current ubuntu runner images.
  arm64:
    # Native builds take about 1.5 minutes; a hang should fail fast, not look like a slow build.
    timeout-minutes: 5
    needs: [brain, web]
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - run: docker buildx build --platform linux/arm64 services/brain
      - run: docker buildx build --platform linux/arm64 -f web/Dockerfile .
      - run: docker buildx build --platform linux/arm64 infra/db
      - run: docker buildx build --platform linux/arm64 infra/gateway
      - run: docker buildx build --platform linux/arm64 mock-ai

  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
