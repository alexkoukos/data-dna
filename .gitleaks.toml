# The scanner also reads the decoy credentials of X4, the attacks of X2 and the L1 fixtures (fake keys such as AKIAABCDEFGHIJ234567). They are invented,
# random and planted on purpose, so only those files are allowed. Everything else is still scanned.
[extend]
useDefault = true

[allowlist]
description = "Invented decoy credentials and attack samples"
paths = [
  '''data/documents/.*\.md''',
  '''data/eval/attacks.*\.csv''',
  '''services/brain/tests/.*''',
  '''shared/fixtures/.*\.json''',
]
